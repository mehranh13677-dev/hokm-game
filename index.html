<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حکم آنلاین - سیستم کامل</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { 
            background: #1a1a2e; 
            color: #fff; 
            margin: 0; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* نوار بالای صفحه */
        .top-navbar {
            width: 100%;
            max-width: 860px;
            background: #16213e;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-badge { background: #0f3460; padding: 6px 12px; border-radius: 8px; font-size: 13px; }
        .btn-auth {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #0f3460; color: #fff; }

        /* چیدمان اصلی */
        .main-layout {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card-panel { 
            flex: 1 1 380px; 
            height: 560px; 
            background: #16213e; 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .panel-header { 
            background: #0f3460; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #1a1a2e;
        }
        .panel-header h3 { margin: 0; font-size: 15px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .hokm-chat-message { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
        .is-mine { align-self: flex-start; background: #e94560; color: #fff; }
        .is-other { align-self: flex-end; background: #0f3460; color: #eee; }
        .chat-input-area { display: flex; padding: 12px; background: #0f3460; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #1a1a2e; outline: none; background: #1a1a2e; color: #fff; }
        .chat-input-area button { padding: 0 16px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .shop-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .coin-package-card { background: #0f3460; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .coin-package-card h3 { margin: 0; font-size: 13px; }
        .coin-package-card p { margin: 2px 0 0 0; font-size: 11px; color: #aaa; }
        .coin-package-button { padding: 6px 12px; background: #4ecca3; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

        /* مدال لاگین/ثبت‌نام */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #16213e;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content h3 { margin: 0 0 8px 0; text-align: center; }
        .modal-content input {
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- نوار بالا -->
    <header class="top-navbar">
        <div class="user-info">
            <span>♠️ حکم آنلاین</span>
            <div data-auth="logged-in" style="display: none; align-items:center; gap:8px;">
                <span class="user-badge">👤 <span data-user-name>بازیکن</span></span>
                <span class="user-badge">🪙 <span data-user-coins>۱,۰۰۰</span> سکه</span>
            </div>
            <div data-auth="logged-out">
                <span class="user-badge">👤 مهمان (وارد نشده)</span>
            </div>
        </div>
        <div>
            <button data-auth="logged-out" class="btn-auth btn-primary" onclick="openAuthModal()">ورود / ثبت‌نام</button>
            <button data-auth="logged-in" style="display: none;" class="btn-auth btn-secondary" onclick="window.hokmAuth.signOut()">خروج</button>
        </div>
    </header>

    <!-- محیط اصلی: چت + فروشگاه -->
    <main class="main-layout">
        <!-- چت روم -->
        <div class="card-panel" data-chat>
            <div class="panel-header">
                <h3>💬 چت روم</h3>
                <button data-chat-mute style="background:none;border:none;font-size:18px;cursor:pointer;">🔊</button>
            </div>
            <div class="chat-messages" data-chat-messages id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" data-chat-input id="chatInput" placeholder="پیامی بنویسید...">
                <button data-chat-send id="chatSend">ارسال</button>
            </div>
        </div>

        <!-- فروشگاه -->
        <div class="card-panel" data-shop-container>
            <div class="panel-header">
                <h3>🛍️ فروشگاه و خرید سکه</h3>
                <span style="font-size: 12px; color: #4ecca3;">🪙 <span data-shop-coins>۰</span></span>
            </div>
            <div class="shop-body">
                <div style="font-size: 13px; color: #aaa;">بسته‌های سکه</div>
                <div data-coin-packages style="display:flex; flex-direction:column; gap:8px;"></div>
                <div style="font-size: 13px; color: #aaa; margin-top:10px;">آیتم‌ها</div>
                <div data-shop-items style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>
    </main>

    <!-- مدال ورود / ثبت‌نام -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">ورود به حساب</h3>
            <input type="text" id="authDisplayName" placeholder="نام نمایشی (برای ثبت‌نام)" style="display: none;">
            <input type="email" id="authEmail" placeholder="ایمیل...">
            <input type="password" id="authPassword" placeholder="رمز عبور...">
            <button id="authSubmitBtn" class="btn-auth btn-primary" onclick="handleAuthSubmit()">ورود</button>
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:8px;">
                <a href="javascript:void(0)" style="color:#4ecca3;" onclick="toggleAuthMode()" id="toggleAuthText">حساب ندارید؟ ثبت‌نام کنید</a>
                <a href="javascript:void(0)" style="color:#aaa;" onclick="closeAuthModal()">بستن</a>
            </div>
        </div>
    </div>

    <!-- ۱. کتابخانه کلاینت Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ۲. فایل کانفیگ و تنظیمات -->
    <script src="config.js"></script>

    <!-- ۳. ماژول‌های پروژه -->
    <script src="auth.js"></script>
    <script src="chat.js"></script>
    <script src="shop.js"></script>

    <script>
        let isSignUpMode = false;

        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
        }
        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('modalTitle').textContent = isSignUpMode ? 'ثبت‌نام کاربر جدید' : 'ورود به حساب';
            document.getElementById('authDisplayName').style.display = isSignUpMode ? 'block' : 'none';
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'ثبت‌نام' : 'ورود';
            document.getElementById('toggleAuthText').textContent = isSignUpMode ? 'حساب دارید؟ وارد شوید' : 'حساب ندارید؟ ثبت‌نام کنید';
        }
        async function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authDisplayName').value;

            if (isSignUpMode) {
                await window.hokmAuth.signUp(email, password, name);
            } else {
                await window.hokmAuth.signIn(email, password);
            }
            closeAuthModal();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.hokmChat) {
                window.hokmChat.setRoom("hokm-room-default");
            }
        });
    </script>
</body>
</html>
