<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حکم آنلاین - چت و فروشگاه</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { 
            background: #1a1a2e; 
            color: #fff; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            gap: 20px;
        }

        /* استایل‌های چت */
        .chat-container { 
            width: 100%; 
            max-width: 380px; 
            height: 580px; 
            background: #16213e; 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .chat-header { 
            background: #0f3460; 
            padding: 14px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #1a1a2e;
        }
        .chat-header h3 { margin: 0; font-size: 16px; }
        .chat-messages { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .hokm-chat-message { 
            max-width: 82%; 
            padding: 10px 14px; 
            border-radius: 10px; 
            font-size: 14px; 
            line-height: 1.5;
            word-break: break-word; 
        }
        .is-mine { align-self: flex-start; background: #e94560; color: #fff; }
        .is-other { align-self: flex-end; background: #0f3460; color: #eee; }
        .is-system { align-self: center; background: #533483; font-size: 12px; border-radius: 20px; padding: 4px 12px; }
        .hokm-chat-message-header { font-size: 11px; opacity: 0.8; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
        .chat-input-area { display: flex; padding: 12px; background: #0f3460; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #1a1a2e; outline: none; background: #1a1a2e; color: #fff; }
        .chat-input-area button { padding: 0 16px; background: #e94560; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hokm-chat-empty { text-align: center; margin-top: 120px; color: #888; }

        /* استایل‌های فروشگاه */
        .shop-container {
            width: 100%;
            max-width: 440px;
            height: 580px;
            background: #16213e;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .shop-header {
            background: #0f3460;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a2e;
        }
        .shop-header h3 { margin: 0; font-size: 16px; }
        .shop-balance { background: #e94560; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .shop-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .shop-section-title { font-size: 14px; color: #aaa; margin: 6px 0; }
        .coin-package-card, .shop-item-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .coin-package-card h3, .shop-item-card h3 { margin: 0 0 4px 0; font-size: 14px; }
        .coin-package-card p, .shop-item-card p { margin: 0; font-size: 12px; color: #aaa; }
        .coin-package-price { font-weight: bold; color: #4ecca3; font-size: 13px; margin-top: 4px; }
        .coin-package-button, .shop-buy-button {
            padding: 8px 14px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .coin-package-button:hover, .shop-buy-button:hover { background: #45b390; }
    </style>
</head>
<body>

    <!-- بخش چت -->
    <div class="chat-container" data-chat>
        <div class="chat-header">
            <h3>💬 چت روم حکم آنلاین</h3>
            <button data-chat-mute style="background:none;border:none;font-size:18px;cursor:pointer;">🔊</button>
        </div>
        <div class="chat-messages" data-chat-messages id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" data-chat-input id="chatInput" placeholder="پیامی بنویسید...">
            <button data-chat-send id="chatSend">ارسال</button>
        </div>
    </div>

    <!-- بخش فروشگاه و بسته‌های سکه -->
    <div class="shop-container" data-shop-container>
        <div class="shop-header">
            <h3>🛍️ فروشگاه بازی</h3>
            <div class="shop-balance">🪙 <span data-shop-coins>۰</span> سکه</div>
        </div>
        <div class="shop-body">
            <div class="shop-section-title">بسته‌های خرید سکه</div>
            <div data-coin-packages style="display:flex; flex-direction:column; gap:10px;"></div>

            <div class="shop-section-title" style="margin-top: 10px;">آیتم‌های بازی</div>
            <div data-shop-items style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <!-- اسکریپت‌ها -->
    <script src="chat.js"></script>
    <script src="shop.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.hokmChat) {
                window.hokmChat.setRoom("hokm-room-default");
            }
        });
    </script>
</body>
</html>
